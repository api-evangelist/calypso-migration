description: >-
  Nasdaq publishes no plans, tiers, list prices or price ranges for Calypso
  Migration. Every Calypso product and services page ends in a "Contact Us"
  form. Migration, upgrade and cloud-transition work is sold as a negotiated
  professional-services engagement against a licensed Calypso installation, and
  the named service lines found on the delivery page — Upgrade as a Service,
  Managed Testing Service (described as a multi-year subscription), Custom Code
  as a Service, and the Cloud Lift & Shift Framework — carry no public price.
  There is no self-serve signup, no free tier, and no public API to meter.
