method: probed
source: >-
  Direct unauthenticated HTTP probes of every host this record knows — the
  registrable domain calypso.com and www, the Nasdaq product/portal host
  www.nasdaq.com, and the two Calypso education hosts (km.calypso.com,
  learncalypso.nasdaq.com). No API baseURL or OpenAPI servers[] host exists for
  this record to probe (see x-coverage in apis.yml).
provider: Calypso Migration
providerId: calypso-migration
description: >-
  Well-known / discovery-document probe for the Nasdaq Calypso Migration
  surface. The only real document served anywhere on these hosts is Nasdaq's
  security.txt, and it is published at the legacy root path
  https://www.nasdaq.com/security.txt rather than at RFC 9116's
  /.well-known/security.txt, which 404s. Every /.well-known/ API-discovery path
  (api-catalog, ai-plugin.json, agent-card.json, agent.json,
  oauth-authorization-server) returns 404 on every host. The two 200s on
  /.well-known/openid-configuration belong to Thinkific, the SaaS learning
  platform behind the Calypso education sites, not to Nasdaq or Calypso — see
  the note on those entries.
hosts:
  - host: www.nasdaq.com
    note: >-
      Nasdaq Calypso's product, marketing and legal host. Serves a real
      security.txt, but at /security.txt — the pre-RFC-9116 root location.
    documents:
      - path: /security.txt
        status: 200
        file: calypso-migration-security.txt
        content_type: text/plain
        note: >-
          Real RFC 9116-shaped document (Contact + Acknowledgements) pointing at
          Nasdaq's Synack-run responsible disclosure program. Served at the
          legacy root path, NOT under /.well-known/.
      - path: /.well-known/security.txt
        status: 404
      - path: /.well-known/api-catalog
        status: 404
      - path: /.well-known/openid-configuration
        status: 404
      - path: /.well-known/oauth-authorization-server
